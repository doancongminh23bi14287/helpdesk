name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: helpdesk_test
          MARIADB_USER: helpdesk
          MARIADB_PASSWORD: helpdesk_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      ENV: test
      DB_URL: mysql+pymysql://helpdesk:helpdesk_pass@127.0.0.1:3307/helpdesk_test
      JWT_SECRET: ci-test-secret-not-for-production-123456
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EMAIL_FEATURES_ENABLED: "false"
      SMTP_PASS: test
      IMAP_PASS: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libmagic1 mariadb-client
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare databases
        run: |
          mysql -h 127.0.0.1 -P 3307 -u root -proot -e "CREATE DATABASE IF NOT EXISTS helpdesk_test;"
          mysql -h 127.0.0.1 -P 3307 -u root -proot -e "GRANT ALL PRIVILEGES ON helpdesk_test.* TO 'helpdesk'@'%';"
      - name: Run backend tests
        working-directory: backend
        run: pytest
      - name: Verify Alembic upgrade
        working-directory: backend
        run: alembic upgrade head
      - name: Build backend Docker image
        run: docker build -t customerhub-backend-ci ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint if configured
        working-directory: frontend
        run: |
          if npm run | grep -qE '^  lint'; then
            npm run lint
          else
            echo "No frontend lint script configured; skipping."
          fi
