worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Allow uploads up to 15 MB (app limit is 10 MB; headroom for multipart overhead)
    client_max_body_size 15m;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── HTTP redirect (enable once cert is ready) ─────────────────────────────
    # Uncomment after: certbot --nginx -d customerhub.osd.vn
    #
    # server {
    #     listen 80;
    #     server_name customerhub.osd.vn;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server block (HTTP — switch listen to 443 ssl when cert is ready) ─
    server {
        listen 80;
        server_name customerhub.osd.vn;

        # ── HTTPS / SSL (uncomment after: certbot --nginx -d customerhub.osd.vn)
        # listen 443 ssl;
        # ssl_certificate     /etc/letsencrypt/live/customerhub.osd.vn/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/customerhub.osd.vn/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 10m;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Static frontend (React SPA) ───────────────────────────────────────
        # deploy.sh copies frontend/dist/* here after each build
        root /var/www/customerhub;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-cache for hashed Vite assets (js/css filenames include content hash)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── API proxy ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Socket.IO (WebSocket upgrade) ─────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Liveness / readiness (restrict to monitoring IPs if needed) ───────
        location ~ ^/(health|ready|metrics)$ {
            proxy_pass         http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # allow 10.0.0.0/8;
            # deny  all;
        }

        # Uploaded files are served through the API only; direct path access blocked
        location /files/ {
            deny all;
            return 404;
        }
    }
}
