[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "echo '=== START DEPLOY ===' && echo \"PORT=${PORT:-9000}\" && alembic upgrade head && echo '=== ALEMBIC DONE ===' && uvicorn app.main:application --host 0.0.0.0 --port ${PORT:-9000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
