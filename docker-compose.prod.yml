version: "3.9"

# Production compose — no dev mounts, no exposed DB/Redis ports.
# Backend binds to localhost only; Nginx (host process) proxies from 80/443.
# Run: docker compose -f docker-compose.prod.yml up -d

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Explicit mapping so compose knows which keys to pull from .env.prod
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_db}
      MYSQL_USER: ${MYSQL_USER:-helpdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # Port intentionally NOT exposed — reachable only inside prod-net
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "helpdesk", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Cache / Message broker ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Port intentionally NOT exposed — reachable only inside prod-net
    # No persistence: acceptable for session cache and task queue
    networks:
      - prod-net

  # ── API server ────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    image: customerhub-backend:latest
    restart: unless-stopped
    # Bind localhost-only so only the host Nginx can reach the API
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env.prod
    volumes:
      - files_data:/app/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prod-net

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery_worker:
    image: customerhub-backend:latest
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env.prod
    volumes:
      - files_data:/app/files
    depends_on:
      - backend
    networks:
      - prod-net

  # ── Celery beat (scheduler) ───────────────────────────────────────────────────
  celery_beat:
    image: customerhub-backend:latest
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env.prod
    volumes:
      - files_data:/app/files
    depends_on:
      - backend
    networks:
      - prod-net

  # Frontend: no service here.
  # Build with: cd frontend && npm ci && npm run build
  # Then copy dist/ to /var/www/customerhub for Nginx to serve.

volumes:
  db_data:
  files_data:

networks:
  prod-net:
    driver: bridge
